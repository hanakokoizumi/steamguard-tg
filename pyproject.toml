[project]
name = "steamguard-tg"
version = "0.2.0"
description = "Private Telegram bot for Steam Guard codes and confirmations"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50,<51",
    "httpx>=0.28,<0.29",
    "pillow>=12,<13",
    "protobuf>=7.35.1,<8",
    "python-dotenv>=1.2,<2",
    "python-telegram-bot[job-queue]>=22.5,<23",
    "pyzbar>=0.1.9,<0.2",
    "sqlalchemy>=2.0.44,<2.1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.14,<0.16",
    "pip-audit>=2.9,<3",
    "grpcio-tools>=1.78,<2",
    "qrcode>=8,<10",
    "pyotp>=2.9,<3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
exclude = ["protobufs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
